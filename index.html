<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IronLog — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0d0d0f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
    }

    .login-root {
      width: 100%;
      max-width: 900px;
      min-height: 600px;
      background: #0d0d0f;
      display: flex;
      color: #f0ede8;
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      border: 0.5px solid #1e1e24;
    }

    .bg-texture {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(ellipse 80% 60% at 70% 50%, rgba(255, 90, 40, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 10% 90%, rgba(255, 90, 40, 0.05) 0%, transparent 50%);
      pointer-events: none;
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 48px 40px;
      position: relative;
      min-width: 0;
    }

    .workout-visual {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.12;
      pointer-events: none;
    }

    .workout-visual svg {
      width: 80%;
      height: 80%;
    }

    .brand-tag {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      letter-spacing: 4px;
      color: #ff5a28;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .hero-headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(36px, 5vw, 60px);
      line-height: 1;
      color: #f0ede8;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .hero-headline span {
      color: #ff5a28;
    }

    .hero-sub {
      margin-top: 12px;
      font-size: 14px;
      color: #6b6b72;
      font-weight: 300;
      line-height: 1.6;
      max-width: 280px;
    }

    .stats-row {
      display: flex;
      gap: 24px;
      margin-top: 32px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: #ff5a28;
    }

    .stat-label {
      font-size: 11px;
      color: #555;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* ── RIGHT PANEL ── */
    .right-panel {
      width: 380px;
      min-width: 320px;
      background: #131316;
      border-left: 0.5px solid #1e1e24;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 40px;
      position: relative;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: #ff5a28;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 2px;
      color: #f0ede8;
    }

    .form-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      letter-spacing: 1px;
      color: #f0ede8;
      margin-bottom: 4px;
    }

    .form-sub {
      font-size: 13px;
      color: #555;
      margin-bottom: 28px;
      font-weight: 300;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .field label {
      font-size: 12px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #555;
      font-weight: 500;
    }

    .field input {
      background: #0d0d0f;
      border: 0.5px solid #2a2a32;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      color: #f0ede8;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: #ff5a28;
      box-shadow: 0 0 0 3px rgba(255, 90, 40, 0.1);
    }

    .field input::placeholder {
      color: #333;
    }

    .forgot {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 20px;
    }

    .forgot a {
      font-size: 12px;
      color: #555;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .forgot a:hover {
      color: #ff5a28;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: #ff5a28;
      border: none;
      border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 12px;
    }

    .btn-login:hover {
      background: #e04d20;
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .divider-h {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
    }

    .divider-h::before,
    .divider-h::after {
      content: '';
      flex: 1;
      height: 0.5px;
      background: #1e1e24;
    }

    .divider-h span {
      font-size: 11px;
      color: #333;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .btn-google {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 0.5px solid #2a2a32;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: #888;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-google:hover {
      border-color: #444;
      color: #ccc;
    }

    .signup-link {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #444;
    }

    .signup-link a {
      color: #ff5a28;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .right-panel > * {
      animation: fadeUp 0.5s ease both;
    }

    .logo-area      { animation-delay: 0.05s; }
    .form-title     { animation-delay: 0.10s; }
    .form-sub       { animation-delay: 0.12s; }
    .field-email    { animation-delay: 0.18s; }
    .field-password { animation-delay: 0.22s; }
    .forgot         { animation-delay: 0.26s; }
    .btn-login      { animation-delay: 0.30s; }
    .divider-h      { animation-delay: 0.33s; }
    .btn-google     { animation-delay: 0.36s; }
    .signup-link    { animation-delay: 0.40s; }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .left-panel {
        display: none;
      }
      .right-panel {
        width: 100%;
        border: none;
      }
    }
  </style>
</head>
<body>

  <div class="login-root">
    <div class="bg-texture"></div>

    <!-- LEFT PANEL -->
    <div class="left-panel">
      <div class="workout-visual">
        <svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="60" y="180" width="280" height="20" rx="10" fill="#ff5a28"/>
          <rect x="40" y="160" width="40" height="60" rx="8" fill="#ff5a28"/>
          <rect x="320" y="160" width="40" height="60" rx="8" fill="#ff5a28"/>
          <rect x="20" y="150" width="30" height="80" rx="6" fill="#ff5a28" opacity="0.6"/>
          <rect x="350" y="150" width="30" height="80" rx="6" fill="#ff5a28" opacity="0.6"/>
          <ellipse cx="200" cy="260" rx="60" ry="10" fill="#ff5a28" opacity="0.15"/>
          <rect x="185" y="200" width="30" height="70" rx="4" fill="#ff5a28" opacity="0.3"/>
        </svg>
      </div>

      <div class="brand-tag">Seu treino. Sua evolução.</div>
      <div class="hero-headline">
        Construa<br>
        seu <span>físico</span><br>
        ideal
      </div>
      <p class="hero-sub">
        Registre, analise e supere seus limites. Seu histórico de treinos em um só lugar.
      </p>

      <div class="stats-row">
        <div class="stat">
          <span class="stat-num">12K+</span>
          <span class="stat-label">Exercícios</span>
        </div>
        <div class="stat">
          <span class="stat-num">98%</span>
          <span class="stat-label">Satisfação</span>
        </div>
        <div class="stat">
          <span class="stat-num">∞</span>
          <span class="stat-label">Progresso</span>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <div class="logo-area">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <rect x="3" y="9" width="14" height="2.5" rx="1.25" fill="white"/>
            <rect x="1" y="7.5" width="3" height="5" rx="1" fill="white"/>
            <rect x="16" y="7.5" width="3" height="5" rx="1" fill="white"/>
          </svg>
        </div>
        <span class="logo-name">IronLog</span>
      </div>

      <div class="form-title">Entrar</div>
      <div class="form-sub">Bem-vindo de volta, atleta.</div>

      <div class="field field-email">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" />
      </div>

      <div class="field field-password">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <div class="forgot">
        <a href="#">Esqueceu a senha?</a>
      </div>

      <button class="btn-login" type="button">Entrar</button>

      <div class="divider-h"><span>ou</span></div>

      <button class="btn-google" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24">
          <path fill="#EA4335" d="M5.266,9.765C6.199,6.939 8.854,4.909 12,4.909C13.691,4.909 15.218,5.509 16.418,6.491L19.909,3C17.782,1.145 15.055,0 12,0C7.27,0 3.198,2.698 1.24,6.65L5.266,9.765Z"/>
          <path fill="#34A853" d="M16.041,18.013C14.951,18.716 13.566,19.091 12,19.091C8.866,19.091 6.219,17.077 5.277,14.268L1.237,17.335C3.193,21.294 7.265,24 12,24C14.933,24 17.735,22.957 19.834,20.999L16.041,18.013Z"/>
          <path fill="#4A90D9" d="M19.834,21C21.996,18.952 23.455,15.904 23.455,12C23.455,11.291 23.345,10.527 23.182,9.818L12,9.818L12,14.455L18.436,14.455C18.119,16.014 17.266,17.221 16.041,18.013L19.834,21Z"/>
          <path fill="#FBBC05" d="M5.277,14.268C5.038,13.556 4.909,12.794 4.909,12C4.909,11.218 5.034,10.467 5.266,9.765L1.24,6.65C0.437,8.26 0,10.075 0,12C0,13.92 0.445,15.73 1.237,17.335L5.277,14.268Z"/>
        </svg>
        Continuar com Google
      </button>

      <div class="signup-link">
        Não tem conta? <a href="#">Criar conta grátis</a>
      </div>
    </div>
  </div>

</body>
</html>
